events {}

http {
  resolver 127.0.0.11 valid=10s;
  client_max_body_size 25m;

  server {
    listen 8080;
    set $el http://execution:8545;
    set $cl http://consensus:3500;

    # Beacon REST API
    location /eth/ {
      proxy_pass $cl;
      proxy_read_timeout 60s;
    }

    # Execution JSON-RPC (eth, net, web3)
    location / {
      proxy_pass $el;
      proxy_set_header Content-Type application/json;
      proxy_read_timeout 60s;
    }
  }
}
